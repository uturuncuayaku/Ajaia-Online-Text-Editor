services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ajaia-online-text-editor
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
    volumes:
      - ajaia-data:/app/prisma

volumes:
  ajaia-data:
